[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "lss-erp-mcp"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mcp>=1.28,<2",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "keyring>=25,<26",
]

[project.optional-dependencies]
dev = [
  "fastapi>=0.115,<1",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "pip-audit>=2.7,<3",
  "uvicorn>=0.30,<1",
]

[project.scripts]
lss-erp-mcp = "lss_erp_mcp.__main__:main"
lss-erp-mcp-credential = "lss_erp_mcp.credential_cli:main"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "real_api: requires an explicitly approved development ERP API",
  "canary_write: writes only to an approved draft test week",
]
